bundle:
  name: essential-callcenter

# Bundle de bootstrap/operação pontual do Unity Catalog: sobe os notebooks essenciais
# como jobs SEM schedule, para rodar sob demanda via CLI (`dm run <job> -l essential`)
# — sem import manual pela UI.

variables:
  CATALOG:       { default: prd }
  BRONZE_SCHEMA: { default: b_dm_callcenter }
  PRIV_GROUP:    { default: dm_pii_readers }

sync:
  include:
    - "*.ipynb"

workspace:
  # Host resolvido pelo profile do Databricks CLI (~/.databrickscfg), fora do versionamento.
  profile: prd

# A lib compartilhada vira wheel e é anexada aos jobs que a importam (setup_pii_functions,
# benchmark), tornando `security`/`transforms` importáveis sem depender de Repos.
artifacts:
  dm_lib:
    type: whl
    path: ../lib
    build: python -m build --wheel

targets:
  prd:
    default: true

resources:
  jobs:
    # Cria os schemas (b_/s_/g_dm_callcenter) e os Volumes de checkpoint. Executado no
    # bootstrap do ambiente (após `dm setup-catalog`, antes dos jobs das camadas);
    # reexecutável de forma idempotente (CREATE ... IF NOT EXISTS).
    setup-databases:
      name: "setup-databases"
      tasks:
        - task_key: create_databases
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ./create_databases.ipynb
          timeout_seconds: 0

    # Cria as funções de mask de PII no Unity Catalog. Rodar antes das dimensões (que
    # aplicam as máscaras às próprias colunas).
    setup-pii-functions:
      name: "setup-pii-functions"
      tasks:
        - task_key: setup_pii_functions
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ./setup_pii_functions.ipynb
            base_parameters:
              catalog:          ${var.CATALOG}
              bronze_schema:    ${var.BRONZE_SCHEMA}
              privileged_group: ${var.PRIV_GROUP}
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

    # Benchmark reprodutível (ad-hoc). Parâmetros pelos widgets do notebook.
    benchmark:
      name: "benchmark"
      tasks:
        - task_key: benchmark
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ./benchmark.ipynb
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0
