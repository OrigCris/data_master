bundle:
  name: gold-callcenter

variables:
  TIMEZONE:      { default: America/Sao_Paulo }
  SCHEDULE_CRON: { default: "0 0 6 * * ?" }
  CATALOG:       { default: prd }
  BRONZE_SCHEMA: { default: b_dm_callcenter }
  SILVER_SCHEMA: { default: s_dm_callcenter }
  GOLD_SCHEMA:   { default: g_dm_callcenter }

sync:
  include:
    - notebooks/**

workspace:
  # Host resolvido pelo profile do Databricks CLI (~/.databrickscfg), fora do versionamento.
  profile: prd

targets:
  prd:
    default: true

resources:
  jobs:
    gold-job:
      name: "gold-job"
      # Sem schedule próprio: é orquestrado por dependência (bundle orchestration).

      tasks:
        - task_key: create_visao_assistentes_gold
          description: Cria/atualiza os dados da tabela visao_assistentes
          existing_cluster_id: <ID_CLUSTER>
          notebook_task:
            notebook_path: ./notebooks/visao_assistentes.ipynb
            base_parameters:
              catalog:       ${var.CATALOG}
              bronze_schema: ${var.BRONZE_SCHEMA}
              silver_schema: ${var.SILVER_SCHEMA}
              gold_schema:   ${var.GOLD_SCHEMA}
          timeout_seconds: 0

        - task_key: create_visao_ura_calls_gold
          description: Cria/atualiza os dados da tabela visao_ura_calls
          existing_cluster_id: <ID_CLUSTER>
          notebook_task:
            notebook_path: ./notebooks/visao_ura_calls.ipynb
            base_parameters:
              catalog:       ${var.CATALOG}
              silver_schema: ${var.SILVER_SCHEMA}
              gold_schema:   ${var.GOLD_SCHEMA}
          timeout_seconds: 0
