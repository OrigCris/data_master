bundle:
  name: silver-callcenter

sync:
  include:
    - notebooks/**

workspace:
  # Host resolvido pelo profile do Databricks CLI (~/.databrickscfg), fora do versionamento.
  profile: prd

# Empacota a lib compartilhada (transforms/quality/security) como wheel e a disponibiliza
# no cluster dos jobs, tornando `transforms`/`quality`/`security` importáveis.
artifacts:
  dm_lib:
    type: whl
    path: ../lib
    build: python -m build --wheel

targets:
  prd:
    default: true

resources:
  jobs:
    silver-job:
      name: "silver-job"
      # Sem schedule próprio: é orquestrado por dependência (bundle orchestration).
      job_clusters:
        - job_cluster_key: cluster-job-dm-silver
          new_cluster:
            spark_version: 15.4.x-scala2.12
            data_security_mode: USER_ISOLATION
            node_type_id: Standard_D4ds_v6
            num_workers: 1

      tasks:
        - task_key: create_ura_silver
          description: Cria/atualiza os dados da tabela TABE_URA_ANLT (silver)
          job_cluster_key: cluster-job-dm-silver
          notebook_task:
            notebook_path: ./notebooks/silver_ura.ipynb
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

        - task_key: create_calls_silver
          description: Cria/atualiza os dados da tabela TABE_CALLS (silver)
          job_cluster_key: cluster-job-dm-silver
          notebook_task:
            notebook_path: ./notebooks/silver_calls.ipynb
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

        - task_key: create_surveys_silver
          description: Cria/atualiza os dados da tabela TABE_PESQ_URA (silver)
          job_cluster_key: cluster-job-dm-silver
          notebook_task:
            notebook_path: ./notebooks/silver_pesq_ura.ipynb
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0
