[project]
name = "dm-callcenter-lib"
version = "0.1.0"
description = "Bibliotecas compartilhadas (transforms, quality, security) do pipeline Data Master."
requires-python = ">=3.10"
# pyspark é provido pelo runtime do Databricks — não declarado como dependência.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transforms", "quality", "security"]
