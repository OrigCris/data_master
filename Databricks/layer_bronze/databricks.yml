bundle:
  name: bronze-callcenter

workspace:
  # Host resolvido pelo profile do Databricks CLI (~/.databrickscfg), fora do versionamento.
  profile: prd

sync:
  include:
    - notebooks/**

variables:
  # gerais
  CATALOG:         { default: prd }
  SCHEMA:          { default: b_dm_callcenter }
  TIMEZONE:        { default: America/Sao_Paulo }
  QTD_CLIENTES:    { default: "10000" }
  QTD_ASSIST:      { default: "1000" }

  # streaming
  STREAM_CRON: { default: "0 */30 * * * ?" }
  SECRET_SCOPE:    { default: data-master-akv }
  EVENTHUB_NAMESPACE: { default: evhnscjtecprd001 }
  # Chaves no Key Vault com as credenciais da SPN consumidora (OAuth/Entra ID).
  SP_CLIENT_ID_SECRET:     { default: ServicePrincipalDTBAppId }
  SP_CLIENT_SECRET_SECRET: { default: ServicePrincipalDTBSecret }
  SP_TENANT_ID_SECRET:     { default: ServicePrincipalDTBTenantId }
  CHECKPOINT_BASE: { default: "/Volumes/prd/b_dm_callcenter/checkpoints/bronze" }
  STREAM_NOTEBOOK: { default: "${workspace.root_path}/files/notebooks/bronze_streaming" }
  RUN_AS_USER: { default: "cristiano.tecnologia.data@hotmail.com" }

# A lib compartilhada vira wheel e é anexada aos jobs: a Bronze usa `transforms.contracts`
# para o parse estrutural e as dimensões usam `security` para aplicar as column masks.
artifacts:
  dm_lib:
    type: whl
    path: ../lib
    build: python -m build --wheel

resources:
  jobs:
    # ---------------------- JOB dimensões ----------------------
    bronze-dim:
      name: "bronze-dim"
      # Sem schedule próprio: é orquestrado por dependência (bundle orchestration).
      # (O job bronze-streaming mantém schedule próprio por ser ingestão contínua.)

      tasks:
        - task_key: create_dim_clientes
          description: Cria/atualiza a dimensão de clientes (Bronze)
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/bronze_dim_clientes
            base_parameters:
              catalog: ${var.CATALOG}
              schema: ${var.SCHEMA}
              table: dim_clientes
              qtd_clientes: ${var.QTD_CLIENTES}
          libraries:
            - pypi: { package: faker }
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

        - task_key: create_dim_assistentes
          description: Cria/atualiza a dimensão de assistentes (Bronze)
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/bronze_dim_assistentes
            base_parameters:
              catalog: ${var.CATALOG}
              schema: ${var.SCHEMA}
              table: dim_assistentes
              qtd_assistentes: ${var.QTD_ASSIST}
          libraries:
            - pypi: { package: faker }
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

    # ---------------------- JOB streaming ----------------------
    bronze-streaming:
      name: "bronze-streaming"
      # 1 execução por vez: com AvailableNow, se o run anterior ainda processa o
      # backlog, não iniciamos outro sobre o mesmo checkpoint (evita concorrência
      # na mesma fonte/checkpoint entre execuções agendadas).
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: ${var.STREAM_CRON}
        timezone_id: ${var.TIMEZONE}
        pause_status: UNPAUSED

      tasks:
        - task_key: ingest_ura
          description: "Event Hubs → Bronze: ura (AvailableNow)"
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ${var.STREAM_NOTEBOOK}
            base_parameters:
              catalog:        ${var.CATALOG}
              schema:         ${var.SCHEMA}
              table_name:     "ura_once"
              eventhub_name:  "evh_cj_tec_ura"
              eventhub_namespace: ${var.EVENTHUB_NAMESPACE}
              secret_scope:   ${var.SECRET_SCOPE}
              sp_client_id_secret:     ${var.SP_CLIENT_ID_SECRET}
              sp_client_secret_secret: ${var.SP_CLIENT_SECRET_SECRET}
              sp_tenant_id_secret:     ${var.SP_TENANT_ID_SECRET}
              checkpoint_base: ${var.CHECKPOINT_BASE}
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

        - task_key: ingest_calls
          description: "Event Hubs → Bronze: calls (AvailableNow)"
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ${var.STREAM_NOTEBOOK}
            base_parameters:
              catalog:        ${var.CATALOG}
              schema:         ${var.SCHEMA}
              table_name:     "calls_once"
              eventhub_name:  "evh_cj_tec_calls"
              eventhub_namespace: ${var.EVENTHUB_NAMESPACE}
              secret_scope:   ${var.SECRET_SCOPE}
              sp_client_id_secret:     ${var.SP_CLIENT_ID_SECRET}
              sp_client_secret_secret: ${var.SP_CLIENT_SECRET_SECRET}
              sp_tenant_id_secret:     ${var.SP_TENANT_ID_SECRET}
              checkpoint_base: ${var.CHECKPOINT_BASE}
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

        - task_key: ingest_surveys
          description: "Event Hubs → Bronze: surveys (AvailableNow)"
          existing_cluster_id: 0902-204343-vxrvf73n
          notebook_task:
            notebook_path: ${var.STREAM_NOTEBOOK}
            base_parameters:
              catalog:        ${var.CATALOG}
              schema:         ${var.SCHEMA}
              table_name:     "surveys_once"
              eventhub_name:  "evh_cj_tec_surveys"
              eventhub_namespace: ${var.EVENTHUB_NAMESPACE}
              secret_scope:   ${var.SECRET_SCOPE}
              sp_client_id_secret:     ${var.SP_CLIENT_ID_SECRET}
              sp_client_secret_secret: ${var.SP_CLIENT_SECRET_SECRET}
              sp_tenant_id_secret:     ${var.SP_TENANT_ID_SECRET}
              checkpoint_base: ${var.CHECKPOINT_BASE}
          libraries:
            - whl: ../lib/dist/*.whl
          timeout_seconds: 0

targets:
  prd:
    default: true
