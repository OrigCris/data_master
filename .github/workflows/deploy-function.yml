name: Deploy Function

# Publica o código Python da Function App (produtor de eventos). A infraestrutura é
# criada pelo Bicep; este workflow cuida do deploy do CÓDIGO. Disparo manual para
# evitar publicação acidental em produção.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FUNCTION_APP_NAME: funccjtecprd001

jobs:
  deploy:
    name: Publish Function App
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: function_app
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
