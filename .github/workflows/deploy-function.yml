name: Deploy Function

# Publica o código Python da Function App (produtor de eventos). A infraestrutura é
# criada pelo Bicep; este workflow cuida do deploy do CÓDIGO. Disparo manual para
# evitar publicação acidental em produção.
#
# Autenticação por OIDC (federated credential), não por publish profile: o plano
# Flex Consumption desabilita o SCM basic-auth. Requer os secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID (app registration com federated credential
# apontando para este repositório/environment).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FUNCTION_APP_NAME: funccjtecprd001

jobs:
  deploy:
    name: Publish Function App
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Flex Consumption faz o build das dependências no servidor (remote-build);
      # não há flags de Oryx via app setting.
      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: function_app
          remote-build: true
