# Configuração do Ruff (lint) — usada localmente e no CI.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # comprimento de linha (já controlado por line-length)
    "B008",  # chamadas em defaults (UDFs/Typer usam esse padrão)
]

[lint.per-file-ignores]
"tests/**" = ["B"]
"**/__init__.py" = ["F401"]  # re-exports intencionais
