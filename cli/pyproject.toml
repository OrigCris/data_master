[project]
name = "data-master-cli"
version = "0.1.0"
description = "CLI para provisionar, publicar e operar o pipeline Data Master (Azure)."
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.scripts]
dm = "dm.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dm"]
